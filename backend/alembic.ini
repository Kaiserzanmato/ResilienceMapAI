[alembic]
script_location = alembic
prepend_sys_path = .

# Migrations are applied out-of-band (a dev machine or a manual release
# step) against DATABASE_URL — never inside the Vercel serverless function.
# sqlalchemy.url is intentionally left unset here; env.py reads DATABASE_URL
# from the environment at run time instead (see backend/alembic/env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
