name: Sync hazard sources

# Render does not run the Vercel cron in vercel.json, so this calls the same
# routes on a schedule: the source sync (GET /api/cron/sync-sources) and the
# flood-capture drain (GET /api/cron/flood-captures, which picks up capture jobs
# left unfinished, e.g. when the free instance slept mid-job; it is a no-op until
# ENABLE_FLOOD_CAPTURE is on). It also keeps the free Render instance from sitting
# asleep for long stretches.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-sources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNC_URL: https://resiliencemap-api.onrender.com/api/cron/sync-sources
      FLOOD_URL: https://resiliencemap-api.onrender.com/api/cron/flood-captures
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the cron routes
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          call() {
            # A free Render instance can take ~50s to wake up, so allow 120s.
            # The header comes from a curl config on stdin, not argv.
            printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" |
              curl --silent --show-error --max-time 120 --config - \
                --output "$2" --write-out '%{http_code}' "$1"
          }

          run() {
            name="$1"; url="$2"; out="$name.json"
            code=$(call "$url" "$out") || code=000
            if [ "$code" = "000" ] || [ "${code:0:1}" = "5" ]; then
              echo "[$name] attempt 1 returned HTTP $code; retrying once in 60s."
              sleep 60
              code=$(call "$url" "$out") || code=000
            fi
            echo "[$name] HTTP $code"
            # Responses hold only per-source / per-job status, counts and reason codes.
            [ -s "$out" ] && cat "$out" && echo
            case "$code" in
              2??) return 0 ;;
              *) echo "::error::$name returned HTTP $code"; return 1 ;;
            esac
          }

          rc=0
          run sync "$SYNC_URL" || rc=1
          run flood "$FLOOD_URL" || rc=1
          exit $rc
