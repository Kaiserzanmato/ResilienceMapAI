name: Sync hazard sources

# Render does not run the Vercel cron in vercel.json, so this calls the same
# route (GET /api/cron/sync-sources) on a schedule. It also keeps the free
# Render instance from sitting asleep for long stretches.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-sources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYNC_URL: https://resiliencemap-api.onrender.com/api/cron/sync-sources
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the sync route
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          call() {
            # A free Render instance can take ~50s to wake up, so allow 120s.
            # The header comes from a curl config on stdin, not argv.
            printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" |
              curl --silent --show-error --max-time 120 --config - \
                --output response.json --write-out '%{http_code}' "$SYNC_URL"
          }

          status=$(call) || status=000
          if [ "$status" = "000" ] || [ "${status:0:1}" = "5" ]; then
            echo "Attempt 1 returned HTTP $status; retrying once in 60s."
            sleep 60
            status=$(call) || status=000
          fi

          echo "HTTP $status"
          # Response holds only per-source status, counts and reason codes.
          [ -s response.json ] && cat response.json && echo

          case "$status" in
            2??) ;;
            *) echo "::error::Sync route returned HTTP $status"; exit 1 ;;
          esac
